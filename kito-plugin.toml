name = "kitchen"
version = "0.5.0"
description = "A team's kitchen: the behaviour, concepts and recipes it shares to work on its repositories"
api = 2
# On a server: `server_admin` for `kito-server kitchen`. In the directories
# connected to it (`--for-clients`): `read`, to ask the server's kitchen.
permissions = ["read", "server_admin"]

[[server_command]]
name = "kitchen"
about = "The team's kitchen: new <dir> | set <repository> | parts <repository> [part…] | show [repository] | check"

[[command]]
name = "kitchen"
about = "How this team works: the kitchen, concept <name>, recipe <name>, run <tool> --lane <lane>"

[session]
about = "The kitchen's behaviour, and what concepts, recipes and tools it has; in the repository of a kitchen with nothing in it yet, to offer to draft it"

[[tool]]
name = "run"
description = "Runs one of the tools this team gives every agent (the tool `kitchen` lists them, with what each takes), in the working copy of the lane you work in. Prefer it to your own command for what it does."
input = { type = "object", properties = { name = { type = "string", description = "The tool, as `kitchen` lists it" }, lane = { type = "string", description = "The lane you work in, as open_lane gave it: lane/3" }, args = { type = "object", description = "What the tool takes, by name" } }, required = ["name", "lane"] }
timeout_secs = 3600

[[tool]]
name = "kitchen"
description = "How this team wants work done on its repositories: its behaviour (follow it), and the names of the concepts and recipes it has written down. Call it once, before your first change in a task."
input = { type = "object", properties = {} }

[[tool]]
name = "concept"
description = "What a word of this team means, as the team wrote it down. Call it when the task or the code uses one of the concepts the tool `kitchen` listed."
input = { type = "object", properties = { name = { type = "string", description = "The name of the concept, as `kitchen` lists it" } }, required = ["name"] }

[[tool]]
name = "recipe"
description = "How this team does something, step by step. Call it before doing one of the things the tool `kitchen` listed a recipe for, and follow the steps."
input = { type = "object", properties = { name = { type = "string", description = "The name of the recipe, as `kitchen` lists it" } }, required = ["name"] }

[[tool]]
name = "draft"
description = "How to draft this team's kitchen with the person, as an interview you lead: the steps, what the repositories the kitchen is for already say of how they are worked on, and the form of each file. Call it in the kitchen's own repository when the kitchen has nothing in it yet, or when the person asks to draft or revise the kitchen, and follow what it says."
input = { type = "object", properties = {} }

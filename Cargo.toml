[package]
name = "kito-kitchen"
description = "A team's kitchen for Kito: the behaviour, concepts and recipes it shares to work on its repositories"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "kito-kitchen"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.dist]
inherits = "release"
debug = false
strip = true
